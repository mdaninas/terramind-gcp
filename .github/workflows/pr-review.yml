name: Review synthetic PR fixtures

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open pull request targeting main, containing synthetic normalized fixtures
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terramind-synthetic-review-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install trusted locked base package
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --no-dev
      - name: Analyze bounded PR blobs as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: uv run --locked --no-dev python scripts/review_pull_request.py prepare --pull-number "$PULL_NUMBER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-pr-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr-review.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install trusted locked base package
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --no-dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: synthetic-pr-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
      - name: Revalidate PR head and publish advisory comment and check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev python scripts/review_pull_request.py publish
