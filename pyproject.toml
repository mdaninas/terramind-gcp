[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "terramind"
version = "0.1.0"
description = "AI-powered Terraform risk analysis and infrastructure intelligence on Google Cloud."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
terramind = "terramind.cli:main"
terramind-knowledge = "terramind.knowledge_cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.118,<1",
    "uvicorn>=0.35,<1",
]
cloud = [
    "google-cloud-firestore>=2.21,<3",
    "google-cloud-storage>=3,<4",
    "google-genai>=1.50,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "jsonschema>=4.25,<5",
    "fastapi>=0.118,<1",
    "uvicorn>=0.35,<1",
    "httpx2>=2.16,<3",
    "google-genai>=1.50,<3",
    "google-cloud-firestore>=2.21,<3",
    "google-cloud-storage>=3,<4",
    "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terramind"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["terramind.normalizer", "terramind.policies"]

[tool.coverage.report]
show_missing = true
fail_under = 80
